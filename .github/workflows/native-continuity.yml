name: Native behavioral continuity

on:
  push:
    branches: [qualify/continuity]
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Full original application commit SHA'
        type: string
        default: '2dc504fd97d8416f87b6ea7f2fd8ce0332615956'
      candidate_ref:
        description: 'Full candidate SHA; empty uses the workflow commit'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: Paired distribution (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version: ['9.0.0', '9.0.0.dev123']
    uses: ./.github/workflows/native-distribution.yml
    with:
      version: ${{ matrix.version }}
      tag: ${{ matrix.version }}
      source_revision: ${{ inputs.candidate_ref || github.sha }}

  continuity:
    name: Behavioral contracts (${{ matrix.role }})
    if: github.repository == 'julienld/ha-mcp-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [before, after]
    env:
      UV_EXCLUDE_NEWER: '7 days'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      SOURCE_REF: ${{ matrix.role == 'before' && (inputs.baseline_ref || '2dc504fd97d8416f87b6ea7f2fd8ce0332615956') || inputs.candidate_ref || github.sha }}
      HA_IMAGE_GHCR: ghcr.io/home-assistant/home-assistant:2026.10.2
      E2E_EMBEDDED_RUNTIME: ${{ matrix.role == 'after' && 'native' || 'legacy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REF }}
          path: source
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.0"
          python-version: '3.13'
      - name: Overlay identical tests and qualification fixtures only
        run: |
          mkdir -p source/tests/src/e2e/continuity source/tests/fixtures
          cp -a harness/tests/src/e2e/continuity/. source/tests/src/e2e/continuity/
          cp harness/tests/src/e2e/workflows/core/test_statistics_units.py source/tests/src/e2e/workflows/core/
          cp harness/tests/src/e2e/_conftest_embedded.py source/tests/src/e2e/
          cp harness/tests/src/e2e/_conftest_testcontainer.py source/tests/src/e2e/
          cp harness/tests/src/e2e/_conftest_native_runtime.py source/tests/src/e2e/
          cp harness/tests/qualification_artifacts.py source/tests/
          cp -a harness/tests/fixtures/native_qualification source/tests/fixtures/
          uv run -s harness/tests/continuity/provenance.py --source source --harness harness --role '${{ matrix.role }}' --expected "$SOURCE_REF" --output provenance-before.json
      - name: Install source revision's locked test environment
        working-directory: source
        run: uv sync --frozen --all-extras --dev
      - name: Pull the same Core image for both revisions
        run: docker pull "$HA_IMAGE_GHCR"
      - name: Exercise the same public MCP behavioral contracts
        working-directory: source/tests
        run: uv run --frozen pytest src/e2e/continuity/ src/e2e/workflows/core/test_statistics_units.py -n 1 --dist loadscope --tb=short -v --maxfail=0 --junitxml=continuity-results.xml
        env:
          E2E_BACKEND: embedded
          HAMCP_ENV_FILE: tests/.env.test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck source and test identity after execution
        if: always()
        run: uv run -s harness/tests/continuity/provenance.py --source source --harness harness --role '${{ matrix.role }}' --expected "$SOURCE_REF" --output provenance-after.json
      - name: Preserve behavioral results and source identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: continuity-${{ matrix.role }}
          path: |
            source/tests/continuity-results.xml
            provenance-before.json
            provenance-after.json
          if-no-files-found: warn
          retention-days: 14
