name: Publish Dev Channel

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/close-inactive-issues.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Restrict permissions by default
permissions:
  contents: read

concurrency:
  group: publish-dev-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Skip if commit is from semantic-release (version bump commits)
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: Check if should skip
        id: check
        env:
          # Use env var to avoid shell interpretation of backticks in commit messages
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || [[ "$COMMIT_MSG" =~ "chore(release)" ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping dev publish for release commit"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  prepare:
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      dev_version: ${{ steps.version.outputs.dev_version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the dev version number is the commit count.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"

      - name: Require the current Core window before releasing
        run: uv run --locked -s scripts/core_window.py --check-floor --output "$RUNNER_TEMP/release-core-window.json"

      - name: Generate dev version
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # <next release>.dev<commit count>: the same commit produces the
          # SAME number in every workflow (PyPI/Docker here, the dev app), so
          # all surfaces report one dev version. See the script for why the
          # base is the NEXT release and which commit it counts.
          DEV_VERSION=$(scripts/dev_version.sh)

          echo "dev_version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Dev version: $DEV_VERSION (sha: $SHORT_SHA)"
          echo "$DEV_VERSION" > dev-version.txt

      # The mirror sync pins the HACS pre-release to exactly this build, so it
      # reads the number from here rather than recomputing it.
      - name: Hand the dev version to the mirror sync
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dev-version
          path: dev-version.txt
          retention-days: 7

  publish-pypi-dev:
    name: Publish PyPI (dev channel)
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi-dev
      url: https://pypi.org/p/ha-mcp-dev
    permissions:
      contents: read
      id-token: write  # Required for PyPI trusted publishing
    env:
      DEV_VERSION: ${{ needs.prepare.outputs.dev_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"

      - name: Temporarily set package name and version for dev build
        run: |
          # Replace package name and version in pyproject.toml for build only
          sed -i 's/^name = "ha-mcp"/name = "ha-mcp-dev"/' pyproject.toml
          sed -i 's/^version = .*/version = "'"$DEV_VERSION"'"/' pyproject.toml
          # Replace package name in version lookup
          sed -i "s/version('ha-mcp')/version('ha-mcp-dev')/g" src/ha_mcp/__main__.py
          # Add ha-mcp-dev entry point with DEBUG logging
          sed -i '/^ha-mcp = "ha_mcp.__main__:main"$/a ha-mcp-dev = "ha_mcp.__main__:main_dev"' pyproject.toml
          echo "Building ha-mcp-dev version: $DEV_VERSION"
          grep -E '^(name|version) = ' pyproject.toml
          echo "Entry points:"
          grep -A5 '^\[project.scripts\]' pyproject.toml

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-docker-dev:
    name: Publish Docker (dev channel)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (dev tags)
        uses: ./.github/actions/docker-build-python-base-fallback
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Do NOT push :latest from dev builds. :latest is reserved for stable
          # releases (release-publish.yml pushes :latest + :stable together).
          # Dev builds run on every push to master, so tagging :latest here
          # clobbers the default tag with bleeding-edge dev between the biweekly
          # stable releases. The dev channel is :dev (rolling) + :dev-<sha>. (#1475)
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:dev
            ${{ env.REGISTRY }}/${{ github.repository }}:dev-${{ needs.prepare.outputs.short_sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.dev_version }}

  create-prerelease:
    name: Create GitHub pre-release
    # HACS installs the paired archive, while PyPI keeps the complete standalone
    # profile. Only master's exact source build becomes a public pre-release.
    needs: [prepare, publish-pypi-dev]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The notes list the commits since the previous dev build's tag.
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"

      - name: Prepare the paired native release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.dev_version }}
        run: |
          uv run --locked -s scripts/native_release_delivery.py prepare \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" --tag "v$VERSION" \
            --revision "$GITHUB_SHA" --assets "$RUNNER_TEMP/native-release"

      - name: Stamp the full source tag with the installable component metadata
        id: stamp
        env:
          VERSION: ${{ needs.prepare.outputs.dev_version }}
        run: |
          uv run --locked -s scripts/native_release_delivery.py stage-dev-source \
            --repository "$GITHUB_REPOSITORY" --tag "v$VERSION" --revision "$GITHUB_SHA" \
            --assets "$RUNNER_TEMP/native-release"
          # Fixed parent, metadata bytes, identity, message and date make a rerun
          # produce the same commit. HACS reads manifest.json at the tag even
          # when its installer ultimately downloads the release ZIP.
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit --quiet --only \
            -m "chore(internal): stamp the component for dev build ${VERSION} [skip ci]" \
            -- custom_components/ha_mcp_tools/manifest.json custom_components/ha_mcp_tools/const.py
          STAMP_SHA=$(git rev-parse HEAD)
          uv run --locked -s scripts/native_release_delivery.py attest-dev-source \
            --repository "$GITHUB_REPOSITORY" --tag "v$VERSION" --revision "$STAMP_SHA" \
            --assets "$RUNNER_TEMP/native-release"
          echo "revision=$STAMP_SHA" >> "$GITHUB_OUTPUT"

      - name: Retain native assets for an interrupted draft recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-release-${{ needs.prepare.outputs.dev_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-release

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.dev_version }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          STAMP_SHA: ${{ steps.stamp.outputs.revision }}
        run: |
          TAG="v${VERSION}"

          # One line per pull request merged since the previous dev build,
          # then the other ways to install this build.
          python3 scripts/build_mirror_release_notes.py \
            --dev-pin "$VERSION" --dist ha-mcp-dev \
            --source "$GITHUB_SHA" --source-label "${GITHUB_REPOSITORY}@${SHORT_SHA}" \
            --out release_notes.md
          cat >> release_notes.md << EOF

          ### Other installs

          **Docker (dev channel):** \`docker pull ghcr.io/${GITHUB_REPOSITORY}:dev\`

          **PyPI (dev channel):** \`pip install ha-mcp-dev\`
          EOF

          # Preserve the full source tree and the immutable metadata stamp.
          existing=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$existing" ]; then
            remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            test "$remote_sha" = "$STAMP_SHA" || { echo "::error::Dev tag identifies another source"; exit 1; }
          else
            git tag "$TAG" "$STAMP_SHA"
            git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
          fi
          uv run --locked -s scripts/native_release_delivery.py publish \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" --revision "$STAMP_SHA" \
            --assets "$RUNNER_TEMP/native-release" --notes release_notes.md

          echo "✓ Created pre-release $TAG"
