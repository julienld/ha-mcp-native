name: Legacy Core compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_EXCLUDE_NEWER: '7 days'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"
      - name: Build the paired candidate without publishing
        env:
          CANDIDATE_VERSION: 9.0.0.dev${{ github.run_number }}
          CANDIDATE_TAG: native-ci-legacy-${{ github.run_id }}
        run: uv run --locked -s scripts/native_release.py --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --github "$GITHUB_REPOSITORY" --qualification-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: legacy-core-candidate
          path: dist/native/
          if-no-files-found: error

  contract:
    name: Legacy Core ${{ matrix.core }} / ${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        core: ["2026.8.0", "2026.9.0"]
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    env:
      UV_EXCLUDE_NEWER: '7 days'
      HA_IMAGE_GHCR: ghcr.io/home-assistant/home-assistant:${{ matrix.core }}
      EXPECTED_CORE: ${{ matrix.core }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: legacy-core-candidate
          path: dist/native
      - name: Capture the immutable Core image receipt
        id: image
        run: |
          mkdir -p tests/native/out
          docker pull "$HA_IMAGE_GHCR"
          image_id=$(docker image inspect "$HA_IMAGE_GHCR" --format '{{.Id}}')
          docker image inspect "$image_id" > tests/native/out/legacy-image-inspect.json
          echo "id=$image_id" >> "$GITHUB_OUTPUT"
      - name: Install with Core constraints and exercise Legacy before and after restart
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          docker run --rm -e UV_EXCLUDE_NEWER -v "$PWD:/work" -w /work --entrypoint python "$IMAGE_ID" -m tests.native.minimal_qualification --runtime legacy --assets dist/native --work-directory /tmp/legacy-minimal --output tests/native/out/legacy-install.json --repository "$GITHUB_REPOSITORY" --image-receipt tests/native/out/legacy-image-inspect.json --expected-core "$EXPECTED_CORE" --expected-arch "$EXPECTED_ARCH" --python-source "selected Core image interpreter"
      - name: Preserve installation and runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: legacy-core-${{ matrix.core }}-${{ matrix.arch }}
          path: |
            tests/native/out/legacy-image-inspect.json
            tests/native/out/legacy-install.json
            tests/native/out/legacy-install.log
            dist/native/native-build.json
          if-no-files-found: warn

  gate:
    name: Legacy Core Gate
    needs: [package, contract]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Legacy Core contract
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          assert all(job["result"] == "success" for job in results.values()), results
          PY
