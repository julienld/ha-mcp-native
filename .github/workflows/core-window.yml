name: Core compatibility window

on:
  workflow_call:
    outputs:
      matrix:
        value: ${{ jobs.resolve.outputs.matrix }}
      latest:
        value: ${{ jobs.resolve.outputs.latest }}
      python:
        value: ${{ jobs.resolve.outputs.python }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.window.outputs.matrix }}
      latest: ${{ steps.window.outputs.latest }}
      python: ${{ steps.window.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"
      - name: Resolve released Core generations once
        id: window
        run: uv run --locked -s scripts/core_window.py --output core-window.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-window
          path: core-window.json
          if-no-files-found: error

  floor:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-window
      - name: Require explicit HACS and runtime floor elevation
        run: uv run --locked -s scripts/core_window.py --from-file core-window.json --check-floor

  package:
    # A stale source floor must fail the gate without hiding new-Core failures.
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_EXCLUDE_NEWER: '7 days'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-window
      - name: Build one paired qualification artifact
        env:
          NATIVE_VERSION: 9.0.0.dev${{ github.run_number }}
          NATIVE_TAG: native-ci-${{ github.run_id }}
        run: uv run --locked -s scripts/native_release.py --version "$NATIVE_VERSION" --tag "$NATIVE_TAG" --github "$GITHUB_REPOSITORY" --core-window core-window.json --qualification-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-window-candidate
          path: dist/native/
          if-no-files-found: error

  contract:
    name: Installable Core ${{ matrix.core }} / ${{ matrix.arch }} / Python ${{ matrix.python }}
    needs: [resolve, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      UV_EXCLUDE_NEWER: '7 days'
      HA_IMAGE_GHCR: ghcr.io/home-assistant/home-assistant:${{ matrix.core }}
      EXPECTED_CORE: ${{ matrix.core }}
      EXPECTED_PYTHON: ${{ matrix.python }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-window-candidate
          path: dist/native
      - name: Verify the actual image Core, Python and architecture
        run: |
          docker run --rm -e EXPECTED_CORE -e EXPECTED_PYTHON -e EXPECTED_ARCH --entrypoint python "$HA_IMAGE_GHCR" -c '
          import importlib.metadata, os, platform
          actual = {"core": importlib.metadata.version("homeassistant"), "python": platform.python_version(), "arch": {"x86_64": "amd64", "aarch64": "aarch64"}.get(platform.machine(), platform.machine())}
          print(actual)
          assert actual == {key: os.environ["EXPECTED_" + key.upper()] for key in actual}, actual
          '
      - name: Qualify Core-managed installation and native plus legacy runtime contracts
        run: |
          mkdir -p tests/native/out
          docker run --rm -e UV_EXCLUDE_NEWER -v "$PWD:/work" -w /work --entrypoint python "$HA_IMAGE_GHCR" -m tests.native.minimal_qualification --assets dist/native --work-directory /tmp/native-minimal --output tests/native/out/minimal-install.json --repository "$GITHUB_REPOSITORY"
      - name: Preserve version and installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-contract-HA${{ matrix.core }}-${{ matrix.arch }}
          path: |
            tests/native/out/minimal-install.json
            tests/native/out/minimal-install.log
            dist/native/native-build.json
          if-no-files-found: warn

  gate:
    name: Core Window Gate
    needs: [resolve, floor, package, contract]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every window contract and the advertised floor
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          assert all(job["result"] == "success" for job in results.values()), results
          PY
