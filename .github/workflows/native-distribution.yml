name: Native distribution profiles (build only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact supplied X.Y.Z or X.Y.Z.devN version; no publication'
        type: string
        required: true
      tag:
        description: 'Intended matching release tag; no tag is created'
        type: string
        required: true
      source_revision:
        description: 'Source commit to export; empty uses the caller commit'
        type: string
        default: ''
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      source_revision:
        type: string
        default: ''
    outputs:
      artifact_name:
        description: 'Artifact containing both profiles and their common provenance'
        value: ${{ jobs.build.outputs.artifact_name }}
      source_revision:
        description: 'Resolved immutable source revision, not a distribution commit'
        value: ${{ jobs.build.outputs.source_revision }}

permissions:
  contents: read

jobs:
  build:
    # Preparation only; release workflows own publication of reviewed artifacts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      source_revision: ${{ steps.build.outputs.source_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"
          python-version: '3.13'

      - name: Build both profiles from the supplied release coordinates
        id: build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_revision || github.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse --verify --end-of-options "${SOURCE_REF}^{commit}")
          uv run --locked -s scripts/native_release.py \
            --revision "$SOURCE_SHA" --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" \
            --github "$GITHUB_REPOSITORY" --source-github "$GITHUB_REPOSITORY" \
            --with-standalone --prepare-hacs --output dist/native-distribution
          echo "source_revision=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_name=native-distribution-$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Preserve separately installable profiles and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: dist/native-distribution/
          if-no-files-found: error
          retention-days: 14
