name: Native HACS owner qualification (manual)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        topology: [server-only, both]
    env:
      UV_EXCLUDE_NEWER: '7 days'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"
          python-version: '3.14'
      - name: Build unpublished qualification artifacts from this committed SHA
        env:
          CANDIDATE_VERSION: 9.0.0.dev${{ github.run_number }}
          CANDIDATE_TAG: native-ci-hacs-${{ github.run_id }}
        run: |
          uv run --locked -s scripts/core_window.py --output core-window.json
          uv run --locked -s scripts/native_release.py --revision "$GITHUB_SHA" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --github "$GITHUB_REPOSITORY" --core-window core-window.json --qualification-only
      - name: Build exact Core and official HACS owners (setup network only)
        run: |
          docker build --build-arg HA_IMAGE=ghcr.io/home-assistant/home-assistant:2026.10.4 -f tests/native/Dockerfile -t ha-mcp-native-candidate .
          docker build -f tests/native/qualification_hacs/Dockerfile -t ha-mcp-hacs-qualification .
      - name: Exercise actual owners without any external network, token or host mount
        env:
          TOPOLOGY: ${{ matrix.topology }}
        run: uv run --locked -s tests/native/qualification_hacs/run.py --topology "$TOPOLOGY"
      - name: Preserve scoped evidence (never config, authentication or releases)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-hacs-owner-Core2026.10.4-${{ matrix.topology }}
          path: tests/native/qualification_hacs/out/
          if-no-files-found: warn
          retention-days: 14
