name: HAOS native qualification

on:
  push:
    branches: [qualify/haos-native]
  workflow_dispatch:
    inputs:
      pytest_args:
        description: 'Additional pytest arguments'
        type: string
        default: ''
      pytest_paths:
        description: 'Override the targeted continuity, state, area, helper and Supervisor contracts'
        type: string
        default: ''
      force_local_build:
        description: 'Ignore the shared image cache'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: haos-native-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13'
  UV_CACHE_DIR: /tmp/.uv-cache
  LIBGUESTFS_BACKEND: direct
  E2E_NATIVE_ARTIFACTS: ${{ github.workspace }}/dist/haos-qualification
  DEFAULT_PYTEST_PATHS: 'src/e2e/continuity/ src/e2e/basic/test_connection.py src/e2e/workflows/core/test_state.py src/e2e/workflows/areas/test_lifecycle.py src/e2e/workflows/config/test_helper_crud.py src/e2e/basic/test_backend_dispatch_smoke.py::test_backend_dispatch_matches_workflow_env src/e2e/basic/test_backend_dispatch_smoke.py::test_supervisor_addon_tool_behavior_matches_backend'

jobs:
  haos-native:
    name: HAOS native runtime
    if: ${{ github.repository == 'julienld/ha-mcp-native' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      - name: Compute image cache key
        id: key
        run: |
          hash=$(git ls-tree -r HEAD \
            tests/haos_image_build \
            tests/initial_test_state \
            custom_components/ha_mcp_tools \
            homeassistant-addon-webhook-proxy \
            | grep -v '\.md$' | sha256sum | cut -d' ' -f1 | head -c16)
          echo "cache-key=haos-image-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore image from cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}

      - name: Report image-acquisition path
        run: |
          echo "::notice title=HAOS image cache::cache-hit=${{ steps.restore-cache.outputs.cache-hit }} key=${{ steps.key.outputs.cache-key }}"

      - name: Install QEMU + OVMF + libguestfs
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xz-utils curl libguestfs-tools sshpass
          sudo chmod +r /boot/vmlinuz-*

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify runner resources
        run: |
          test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
          lscpu
          free -h
          df -h /tmp
      - name: Free disk space for the local build
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Install build-script Python deps (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: pip install -r tests/haos_image_build/requirements.txt

      - name: Build image locally (cache miss or forced rebuild)
        if: steps.restore-cache.outputs.cache-hit != 'true' || github.event.inputs.force_local_build == 'true'
        run: |
          python3 tests/haos_image_build/build_image.py --verbose \
            --output /tmp/haos-test-image.qcow2

      # PR merge-ref caches are not visible from this qualification branch.
      # Save its own clean bake before per-worker runtime staging begins.
      - name: Save native branch image cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/haos-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.0"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: uv sync --all-extras --dev

      - name: Build paired checkout candidate for Core installation
        run: |
          uv run python -c "from pathlib import Path; from tests.qualification_artifacts import build_candidate_artifacts; build_candidate_artifacts(Path.cwd(), Path('dist/haos-qualification'))"


      - name: Confirm image present
        run: ls -lh /tmp/haos-test-image.qcow2

      - name: Run selected E2E contracts through the HAOS server
        run: |
          cd tests
          uv run pytest $PYTEST_PATHS \
            -n2 --dist loadscope -v --tb=short --maxfail=0 --junitxml=/tmp/haos-native-results.xml $PYTEST_ARGS
        env:
          PYTEST_PATHS: ${{ github.event.inputs.pytest_paths || env.DEFAULT_PYTEST_PATHS }}
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          HAMCP_ENV_FILE: "tests/.env.test"
          HAOS_TEST_IMAGE_PATH: /tmp/haos-test-image.qcow2
          HAOS_TEST_MODE: embedded
          E2E_EMBEDDED_RUNTIME: native
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract HA diagnostics from booted qcow2 (always)
        if: always()
        run: |
          sudo chmod +r /boot/vmlinuz-* || true
          mkdir -p /tmp/haos-native-diagnostics
          cp /tmp/haos-build/haos-serial.log /tmp/haos-native-diagnostics/bake-serial.log 2>/dev/null || true
          shopt -s nullglob
          targets=(/tmp/haos-test-image-gw*.qcow2)
          if [ ${#targets[@]} -eq 0 ]; then
            targets=(/tmp/haos-test-image.qcow2)
          fi
          if [ ! -f "${targets[0]}" ] && [ -f /tmp/haos-build/haos-test-image.qcow2 ]; then
            targets=(/tmp/haos-build/haos-test-image.qcow2)
          fi
          for img in "${targets[@]}"; do
            label=$(basename "$img" .qcow2)
            outdir=/tmp/haos-native-diagnostics/$label
            mkdir -p "$outdir"
            echo "=== extracting diagnostics from $img ==="
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : ll /supervisor/homeassistant \
              > "$outdir/config-dir-listing.txt" 2>&1 \
              || echo "directory listing failed for $img"
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : tar-out /supervisor/homeassistant/.storage "$outdir/storage.tar" \
              || echo ".storage tar-out failed for $img"
            guestfish --ro -a "$img" run \
              : mount /dev/sda8 / \
              : glob copy-out '/supervisor/homeassistant/*.log*' "$outdir/" \
              || echo "log glob copy failed for $img"
            echo "--- [$label] config dir listing ---"
            cat "$outdir/config-dir-listing.txt" || true
          done
          ls -laR /tmp/haos-native-diagnostics/ || true
          python3 scripts/redact_diagnostics_secrets.py /tmp/haos-native-diagnostics

      - name: Upload HAOS native diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: haos-native-diagnostics
          path: |
            /tmp/haos-native-results.xml
            /tmp/haos-native-diagnostics/
            /tmp/haos-diagnostics/
            /tmp/haos-e2e-serial.log
          if-no-files-found: warn
          retention-days: 7
